name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          IFS=. read -r ma mi pa <<< "$VERSION"
          echo "BUILD_NUMBER=$((ma*10000 + mi*100 + ${pa:-0}))" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release --build-name=${{ env.VERSION }} --build-number=${{ env.BUILD_NUMBER }}

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: flutter build web --release --build-name=${{ env.VERSION }}

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: flutter build linux --release --build-name=${{ env.VERSION }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/linux/x64/release/bundle/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          IFS=. read -r ma mi pa <<< "$VERSION"
          echo "BUILD_NUMBER=$((ma*10000 + mi*100 + ${pa:-0}))" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: flutter build macos --release --build-name=${{ env.VERSION }} --build-number=${{ env.BUILD_NUMBER }}

      - run: cd build/macos/Build/Products/Release && zip -r macos-tap_dash.zip tap_dash.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/macos/Build/Products/Release/macos-tap_dash.zip

  # build-ios: disabled until IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64 are set
  build-ios:
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          IFS=. read -r ma mi pa <<< "$VERSION"
          echo "BUILD_NUMBER=$((ma*10000 + mi*100 + ${pa:-0}))" >> $GITHUB_ENV

      - name: Import code signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: temp_signing_password
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security set-keychain-settings -lut 21600 $KEYCHAIN
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN
          security list-keychain -d user -s $KEYCHAIN

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: flutter build ipa --release --build-name=${{ env.VERSION }} --build-number=${{ env.BUILD_NUMBER }}

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: build/ios/ipa/*.ipa

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          IFS=. read -r ma mi pa <<< "$VERSION"
          echo "BUILD_NUMBER=$((ma*10000 + mi*100 + ${pa:-0}))" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release --build-name=${{ env.VERSION }} --build-number=${{ env.BUILD_NUMBER }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/x64/runner/Release/

  create-release:
    runs-on: ubuntu-latest
    needs: [build-android, build-web, build-linux, build-macos, build-windows]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up git-cliff
        uses: kenji-miyake/setup-git-cliff@v2

      - name: Generate changelog for release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          git cliff "$TAG" -o release_changelog.md

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          mkdir -p release
          cp "$(find artifacts/apk -name 'app-release.apk' | head -1)" release/tap_dash-$VERSION.apk
          cp artifacts/macos/*.zip release/tap_dash-$VERSION-macos.zip 2>/dev/null || true
          cp artifacts/ios/*.ipa release/tap_dash-$VERSION.ipa 2>/dev/null || true
          (cd artifacts/web && zip -r ../../release/tap_dash-$VERSION-web.zip .)
          (cd artifacts/linux && zip -r ../../release/tap_dash-$VERSION-linux.zip .)
          (cd artifacts/windows && zip -r ../../release/tap_dash-$VERSION-windows.zip .)

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_changelog.md
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
